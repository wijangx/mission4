<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- STICKY HEADER -->
      <div class="sticky-header">
        <div class="profile-area">
          <div class="profile-info">
            <div class="avatar" id="avatarBox">WA</div>
            <div class="user-text">
              <h2 id="nameLabel">Wijang Asadullah A.</h2>
              <p id="roleLabel">Fullstack Developer</p>
            </div>
          </div>
          <button id="btnEditProfile" class="btn-edit" title="Edit Profile">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path
                d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
              ></path>
              <path
                d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
              ></path>
            </svg>
          </button>
        </div>

        <div class="input-card">
          <div class="input-row">
            <input
              type="text"
              id="taskInput"
              class="input-task"
              placeholder="Masukan tugas di sini..."
            />
            <button id="btnAddTask" class="btn-submit">Add</button>
          </div>
          <div class="settings-row">
            <div class="priority-btns">
              <button class="p-btn" id="btn-high">High</button>
              <button class="p-btn" id="btn-medium">Med</button>
              <button class="p-btn active" id="btn-low">Low</button>
            </div>
            <input type="date" id="dateInput" class="input-date" />
          </div>
        </div>
      </div>
      <!-- SCROLLABLE LIST AREA -->
      <div class="scrollable-content">
        <div>
          <div class="section-header">
            To Do List <span class="count" id="todoCount">0</span>
          </div>
          <div class="list-container" id="todoList"></div>
        </div>
        <div style="padding-bottom: 20px">
          <div class="section-header">
            Done <span class="count" id="doneCount">0</span>
          </div>
          <div class="list-container" id="doneList"></div>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="sticky-footer">
        <button id="btnDeleteAll" class="btn-delete-all">Delete All</button>
      </div>
    </div>

    <!-- MODALS -->
    <div class="modal-overlay" id="editModal">
      <div class="modal-box" style="text-align: left">
        <h3 style="margin-bottom: 20px">Edit Profile</h3>
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="inpName" />
        </div>
        <div class="form-group">
          <label>Jabatan</label>
          <input type="text" id="inpRole" />
        </div>
        <div class="modal-actions" style="margin-top: 24px">
          <button id="btnCancelEdit" class="btn-m cancel">Batal</button>
          <button id="btnSaveEdit" class="btn-m save">Simpan</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="deleteModal">
      <div class="modal-box">
        <h3>Peringatan Sistem</h3>
        <p>
          Seluruh data akan dihapus permanen. Apakah Anda yakin ingin
          melanjutkan?
        </p>
        <div class="modal-actions">
          <button id="btnCancelDelete" class="btn-m cancel">Batal</button>
          <button id="btnConfirmDelete" class="btn-m confirm">Hapus</button>
        </div>
      </div>
    </div>

    <script src="script/script.js"></script>
  </body>
</html>
